      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:50"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      security-updates:
        applies-to: "security-updates"
