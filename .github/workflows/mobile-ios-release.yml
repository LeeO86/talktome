name: Mobile iOS EAS Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Existing v* tag to build; empty uses the selected Git ref'
        required: false
        type: string
      submit:
        description: 'Submit to App Store Connect / TestFlight'
        required: true
        type: boolean
        default: false

concurrency:
  group: mobile-ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: Build iOS with EAS Cloud
    # Enable only after the publisher has configured EAS and Apple credentials.
    if: vars.MOBILE_IOS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      TALKTOME_EXPO_OWNER: ${{ vars.TALKTOME_EXPO_OWNER }}
      TALKTOME_EAS_PROJECT_ID: ${{ vars.TALKTOME_EAS_PROJECT_ID }}
      TALKTOME_IOS_BUNDLE_IDENTIFIER: ${{ vars.TALKTOME_IOS_BUNDLE_IDENTIFIER }}
      TALKTOME_APPLE_TEAM_ID: ${{ vars.TALKTOME_APPLE_TEAM_ID }}
      APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TALKTOME_IOS_SUBMIT: ${{ github.event_name == 'release' || inputs.submit }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_version || github.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Resolve version from Git tags
        id: version
        working-directory: .
        run: node scripts/resolve-build-version.js --github-output "$GITHUB_OUTPUT"
      - name: Set mobile version
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          echo "TALKTOME_MOBILE_VERSION=${APP_VERSION%%[-+]*}" >> "$GITHUB_ENV"
          echo "TALKTOME_MOBILE_BUILD_NUMBER=$((29 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Require Expo credentials
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Set repository secret EXPO_TOKEN'; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Prepare publisher identity and cloud build metadata
        run: node scripts/prepare-eas-release.cjs ios
      - name: Pre-check iOS build number
        run: node scripts/check-ios-build-number.mjs
      - name: Build and optionally submit to TestFlight
        run: |
          set -euo pipefail
          if [ "$TALKTOME_IOS_SUBMIT" = 'true' ]; then
            npx eas-cli build --platform ios --profile production --non-interactive --wait --auto-submit
          else
            npx eas-cli build --platform ios --profile production --non-interactive --wait
          fi
